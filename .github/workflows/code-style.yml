name: C# checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet run --project tools/Plus.CodeStyle -- check
      - run: dotnet build "Plus Emulator.sln" --configuration Release --property:Platform="Any CPU" --no-restore --maxcpucount:1
      - run: dotnet test Plus.Tests --configuration Release --no-build
