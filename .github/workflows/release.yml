name: Release

# Every push to master publishes ready-to-run emulator builds. The hotel
# installers download them from the latest release, so servers need no .NET.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish self-contained builds
        run: |
          for rid in linux-x64 linux-arm64 win-x64; do
            dotnet publish "Plus Emulator.csproj" -c Release -r "$rid" --self-contained \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o "out/$rid"
            mkdir -p "out/$rid/Database"
            cp Database/FreshInstall.sql "out/$rid/Database/"
          done

      - name: Package
        run: |
          mkdir dist
          for rid in linux-x64 linux-arm64; do
            tar -C "out/$rid" --owner=0 --group=0 -czf "dist/plusemu-$rid.tar.gz" .
          done
          (cd out/win-x64 && zip -qr ../../dist/plusemu-win-x64.zip .)
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "PlusEMU $tag" --generate-notes --latest
